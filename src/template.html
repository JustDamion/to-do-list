<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
</head>

<body>
    <header>
        <section class="schedule">
            <nav class="schedule-nav">
                <li class="schedule-nav__item">
                    <button class="schedule-nav__button">Today</button>
                </li>
                <li class="schedule-nav__item">
                    <button class="schedule-nav__button">This Week</button>
                </li>
                <li class="schedule-nav__item">
                    <button class="schedule-nav__button">This Month</button>
                </li>
            </nav>
        </section>

        <section class="projects">
            <h1 class="projects__nav-title">My Projects</h1>
            <nav class="project-nav" id="project-nav"></nav>
        </section>

        <div class="add-project">
            <button class="add-project__button">Add project</button>
            <dialog class="add-project__modal">
                <h2>New Project</h2>
                <label for="title">Name:</label>
                <input type="text" name="title" id="title">
            </dialog>
        </div>
    </header>

    <main id="content"></main>
</body>

</html>
