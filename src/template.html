<!DOCTYPE html>

<head>

    <title>To-Do-List</title>

<body>
    <header>
        <section class="schedule">
            <nav class="schedule-nav">
                <ul class="schedule-nav__list" id="schedule-nav-list">
                    <li class="schedule-nav__item">
                        <button class="schedule-nav__button" id="schedule-nav-day" data-period="today">Today</button>
                    </li>
                    <li class="schedule-nav__item">
                        <button class="schedule-nav__button" id="schedule-nav-week" data-period="week">This
                            Week</button>
                    </li>
                    <li class="schedule-nav__item">
                        <button class="schedule-nav__button" id="schedule-nav-month" data-period="month">This
                            Month</button>
                    </li>
                </ul>
            </nav>
        </section>

        <section class="projects">
            <h1 class="projects__nav-title">My Projects</h1>
            <nav class="project-nav">
                <ul id="project-nav__list"></ul>
            </nav>
        </section>

        <div class="add-project">
            <button class="add-project__button" id="add-project-button">Add project</button>
            <dialog class="add-project__modal" id="add-project-modal">
                <h2>New Project</h2>
                <label for="title">Name:</label>
                <form action="" id="add-project-form">
                    <input type="text" name="title" id="title">
                    <button type="submit" id="add-project-submit">Add new project</button>
                </form>
            </dialog>
        </div>
    </header>
