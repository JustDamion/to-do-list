<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
</head>

<body>
    <header>
        <div class="header__branding">
            <h1 class="branding__title">To-Do-List</h1>
        </div>
    </header>

    <aside class="sidebar">
        <nav class="sidebar__nav">
            <h2 class="nav-title">Schedule</h2>
            <ul class="nav-list" id="nav-list-schedule">
                <li class="nav-list__item">
                    <img class="nav-list__icon" src="./images/icons/calendar-today.svg" alt="" width="256" height="256">
                    <button class="nav-list__button" id="nav-day-button" data-period="today">Today</button>
                </li>
                <li class="nav-list__item">
                    <img class="nav-list__icon" src="./images/icons/calendar-week.svg" alt="" width="256" height="256">
                    <button class="nav-list__button" id="nav-week-button" data-period="week">This
                        Week</button>
                </li>
                <li class="nav-list__item">
                    <img class="nav-list__icon" src="./images/icons/calendar-month.svg" alt="" width="256" height="256">
                    <button class="nav-list__button" id="nav-month-button" data-period="month">This
                        Month</button>
                </li>
            </ul>

            <h2 class="nav-title">Projects</h2>
            <ul class="nav-list" id="nav-list-projects"></ul>
        </nav>

        <div class="add-project">
            <button class="add-project__button" id="add-project-button">Add Project +</button>
            <dialog class="add-project__modal" id="add-project-modal">
                <h2>New Project</h2>
                <label for="title">Name:</label>
                <form action="" id="add-project-form">
                    <input type="text" name="title" id="title">
                    <button type="submit" id="add-project-submit">Add new project</button>
                </form>
            </dialog>
        </div>
    </aside>

    <dialog class="task-details" id="task-details-dialog">
        <form class="task-details__form" action="">
            <div class="details-input">
                <label class="details-input__name" for="task-details-title">Name:</label>
                <input class="details-input__input" type="text" name="" id="task-details-title" disabled>
            </div>
            <div class="details-input">
                <label class="details-input__description" for="task-details-description">Description:</label>
                <input class="details-input__input" type="text" name="" id="task-details-description" disabled>
            </div>
            <div class="details-input">
                <label class="details-input__due-date" for="task-details-due-date">Due Date:</label>
                <input class="details-input__input" type="date" name="" id="task-details-due-date" disabled>
            </div>
            <div class="details-input">
                <label class="details-input__priority" for="task-details-priority">Priority:</label>
                <input class="details-input__input" type="text" name="" id="task-details-priority" disabled>
            </div>
            <div class="details-input">
                <label class="details-input__tags" for="task-details-tags">Tags:</label>
                <input class="details-input__input" type="text" name="" id="task-details-tags" disabled>
            </div>
        </form>
    </dialog>

    <main>
        <section class="content">
            <div class="project" id="project"></div>
            <dialog class="add-task" id="add-task-dialog">
                <form action="" class="add-task__form" id="add-task-form">
                    <div class="form-row">
                        <div class="task-input">
                            <label for="add-task-title" class="task-input__name-label">Name:</label>
                            <input type="text" name="title" id="add-task-title" class="task-input__input">
                        </div>
                        <div class="task-input">
                            <label for="add-task-description" class="task-input__description-label">Description:</label>
                            <input type="text" name="description" id="add-task-description" class="task-input__input">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="task-input">
                            <label for="add-task-due-date" class="task-input__due-date-label">Due Date:</label>
                            <input type="date" name="due-date" id="add-task-due-date" class="task-input__input">
                        </div>
                        <div class="task-input">
                            <label for="add-task-priority" class="task-input__priority-label">Priority:</label>
                            <input type="select" name="priority" id="add-task-priority" class="task-input__input">
                        </div>
                        <div class="task-input">
                            <label for="add-task-tags" class="task-input__tags-label">Tags:</label>
                            <input type="text" name="tags" id="add-task-tags" class="task-input__input">
                        </div>
                    </div>
                    <div class="add-task__actions">
                        <button type="submit" class="add-task__add">Add</button>
                        <button type="button" class="add-task__cancel">Cancel</button>
                    </div>

                </form>
            </dialog>
            <button class="add-task-button" id="add-task-button">Add Task +</button>
        </section>
    </main>
</body>

</html>
