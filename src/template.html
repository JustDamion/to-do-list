<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
</head>

<body>
    <header>
        <section class="projects">
            <h1 class="projects__nav-title">My Projects</h1>
            <nav class="project-nav">
                <li class="project-nav__item">
                    <button class="project-nav__button">Default</button>
                </li>
                <li class="project-nav__item">
                    <button class="project-nav__button">Fitness</button>
                </li>
                <li class="project-nav__item">
                    <button class="project-nav__button">Groceries</button>
                </li>
            </nav>
        </section>

        <button>Add project</button>
    </header>

    <main id="content">
        <div class="project">
            <h1 class="project__title">Fitness</h1>
            <div class="task">
                <div class="task__heading">
                    <input class="task__checkbox" type="checkbox" name="" id="">
                    <h2 class="task__title">Go to the gym</h2>
                </div>

                <div class="task__sub-heading">
                    <p class="task__due-date">10 days</p>
                    <div class="task__tags">
                        <p class="tag">important</p>
                    </div>
                </div>
            </div>

            <div class="task">
                <div class="task__heading">
                    <input class="task__checkbox" type="checkbox" name="" id="">
                    <h2 class="task__title">Walk 1 mile</h2>
                </div>

                <div class="task__sub-heading">
                    <p class="task__due-date">8 days</p>
                    <div class="task__tags">
                        <p class="tag">important</p>
                    </div>
                </div>
            </div>

            <button class="project__add-task-button">Add Task +</button>
        </div>
    </main>
</body>

</html>
